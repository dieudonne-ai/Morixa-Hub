<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Morixa Hub — Reset Password</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .reset-box {
      width: 100%; max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 32px 28px;
    }
    .reset-icon {
      width: 48px; height: 48px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .reset-icon i { font-size: 24px; color: var(--text-1); }
    .reset-box h2 { font-size: 18px; font-weight: 600; color: var(--text-1); margin-bottom: 6px; }
    .reset-box p  { font-size: 13px; color: var(--text-3); margin-bottom: 20px; line-height: 1.6; }
    .field-group { margin-bottom: 14px; }
    .msg { border-radius: var(--radius); padding: 10px 12px; font-size: 13px; display: none; align-items: center; gap: 8px; margin-bottom: 14px; border: 1px solid; }
    .msg-error   { background: var(--error-bg);   color: var(--error-fg);   border-color: var(--tag-cas-bdr); }
    .msg-success { background: var(--success-bg); color: var(--success-fg); border-color: var(--tag-art-bdr); }
    .btn-full { width: 100%; justify-content: center; padding: 10px; }
    .back-link { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-3); }
    .back-link a { color: var(--accent-dim); text-decoration: none; }
  </style>
</head>
<body>

<div class="reset-box">

  <!-- ── ÉTAPE 1 : demander l'email ── -->
  <div id="step-request">
    <div class="reset-icon"><i class="ti ti-lock-question"></i></div>
    <h2>Forgot your password?</h2>
    <p>Enter your email address and we'll send you a link to reset your password.</p>

    <div class="msg msg-error" id="req-error"><i class="ti ti-alert-circle"></i><span></span></div>
    <div class="msg msg-success" id="req-success"><i class="ti ti-circle-check"></i><span></span></div>

    <div class="field-group">
      <div class="field-wrap">
        <i class="ti ti-mail"></i>
        <input class="field-input" type="email" id="request-email" placeholder="doctor@hospital.org">
      </div>
    </div>
    <button class="btn btn-primary btn-full" onclick="requestReset()">
      <span>Send reset link</span>
    </button>
    <div class="back-link"><a href="/login.html">← Back to sign in</a></div>
  </div>

  <!-- ── ÉTAPE 2 : nouveau mot de passe (si ?token= présent) ── -->
  <div id="step-reset" style="display:none;">
    <div class="reset-icon"><i class="ti ti-lock-check"></i></div>
    <h2>Choose a new password</h2>
    <p>Enter and confirm your new password below.</p>

    <div class="msg msg-error" id="reset-error"><i class="ti ti-alert-circle"></i><span></span></div>
    <div class="msg msg-success" id="reset-success"><i class="ti ti-circle-check"></i><span></span></div>

    <div class="field-group">
      <label class="field-label">New password</label>
      <div class="field-wrap">
        <i class="ti ti-lock"></i>
        <input class="field-input" type="password" id="new-password" placeholder="Min. 8 characters">
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Confirm password</label>
      <div class="field-wrap">
        <i class="ti ti-lock-check"></i>
        <input class="field-input" type="password" id="confirm-password" placeholder="Repeat password">
      </div>
    </div>
    <button class="btn btn-primary btn-full" onclick="submitReset()">
      <span>Update password</span>
    </button>
  </div>

</div>

<script src="/api.js"></script>
<script>
  const token = new URLSearchParams(window.location.search).get("token");

  if (token) {
    document.getElementById("step-request").style.display = "none";
    document.getElementById("step-reset").style.display   = "block";
  }

  function showMsg(prefix, type, text) {
    document.getElementById(`${prefix}-error`).style.display   = "none";
    document.getElementById(`${prefix}-success`).style.display = "none";
    const el = document.getElementById(`${prefix}-${type}`);
    el.querySelector("span").textContent = text;
    el.style.display = "flex";
  }

  async function requestReset() {
    const email = document.getElementById("request-email").value.trim();
    if (!email) return showMsg("req", "error", "Please enter your email.");
    try {
      const data = await apiFetch("/auth/forgot-password", {
        method: "POST",
        body:   JSON.stringify({ email }),
      });
      showMsg("req", "success", data.message);
    } catch (e) {
      showMsg("req", "error", e.error || "Something went wrong.");
    }
  }

  async function submitReset() {
    const password = document.getElementById("new-password").value;
    const confirm  = document.getElementById("confirm-password").value;

    if (password.length < 8) return showMsg("reset", "error", "Password must be at least 8 characters.");
    if (password !== confirm) return showMsg("reset", "error", "Passwords do not match.");

    try {
      const data = await apiFetch("/auth/reset-password", {
        method: "POST",
        body:   JSON.stringify({ token, password }),
      });
      showMsg("reset", "success", data.message + " Redirecting to sign in...");
      setTimeout(() => window.location.href = "/login.html", 2000);
    } catch (e) {
      showMsg("reset", "error", e.error || "Could not reset password.");
    }
  }

  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    token ? submitReset() : requestReset();
  });
</script>
</body>
</html>
